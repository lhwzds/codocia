[package]
name = "codocia"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A notebook and compiler that turns what AI agents learn about a codebase into concise, source-grounded docs."
repository = "https://github.com/lhwzds/codocia"
documentation = "https://docs.rs/codocia"
readme = "README.md"
keywords = ["docs", "documentation", "agents", "markdown", "translation"]
categories = ["development-tools", "command-line-utilities"]
exclude = [".codocia", "docs", ".github", "homebrew-tap-template", "npm"]

[[bin]]
name = "codocia"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
